[project]
name = "mongodb-brabo"
version = "0.1.0"
description = "MDB BRABO — a MongoDB DBA TUI cockpit (monitoring, replica set, sharding, WiredTiger, advisor) for SSH"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Acacio Lima Rocha" }]
keywords = ["mongodb", "dba", "tui", "monitoring", "textual"]

dependencies = [
    "textual>=0.60",
    "rich>=13.7",
    "pymongo>=4.6",
]

[project.optional-dependencies]
charts = ["plotext>=5.2"]
keyring = ["keyring>=24.0"]
full = ["plotext>=5.2", "keyring>=24.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "plotext>=5.2"]

[project.scripts]
mdb-brabo = "app:main"
mongodb-brabo = "app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["mongodb_brabo*"]

[tool.setuptools.package-data]
mongodb_brabo = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
